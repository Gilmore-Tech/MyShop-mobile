name: myshop_client
description: MyShop Client App — Book rides and artisan services in Ghana
publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Shared packages
  api_client:
    path: ../../packages/api_client
  shared_models:
    path: ../../packages/shared_models
  shared_ui:
    path: ../../packages/shared_ui
  shared_utils:
    path: ../../packages/shared_utils
  
  # Navigation
  go_router: ^15.1.0
  
  # State management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0
  
  # Networking
  dio: ^5.7.0
  
  # Maps
  google_maps_flutter: ^2.10.0
  mapbox_maps_flutter: ^2.4.0
  geolocator: ^13.0.0
  
  # Payments
  # flutterwave_standard: ^1.0.0  # Add when Flutterwave Flutter SDK is configured
  
  # Storage
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0
  
  # Media
  image_picker: ^1.1.0
  cached_network_image: ^3.4.0
  file_picker: ^8.1.0
  
  # Communication
  url_launcher: ^6.3.0
  
  # Push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0
  
  # Realtime
  socket_io_client: ^3.0.0
  
  # UI
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  intl_phone_field: ^3.2.0

  # Receipts (PDF + native share sheet for share / save-to-files)
  pdf: ^3.11.0
  printing: ^5.13.0
  
  # Utilities
  equatable: ^2.0.7
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.0
  riverpod_lint: ^2.6.0
  mockito: ^5.4.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/i18n/

# ── Launcher Icons ──────────────────────────────────────────────────────────
# NOTE: source PNG (assets/images/myshop_logo.png) is currently 286×306 — too
# small for production. Swap for a 1024×1024 transparent-background master and
# regenerate before any store submission. For internal testing this is OK.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/myshop_logo.png"
  remove_alpha_ios: true
  background_color_ios: "#0F1923"
  adaptive_icon_background: "#0F1923"
  adaptive_icon_foreground: "assets/images/myshop_logo.png"
  min_sdk_android: 24

# ── Native Splash ──────────────────────────────────────────────────────────
# Native splash is a solid dark-navy color with NO logo. The animated in-app
# SplashScreen owns the brand identity — showing the logo here too would mean
# the user sees it twice (native splash → in-app splash). Keeping this plain
# gives a seamless handoff: OS draws #0F1923, Flutter takes over on the same bg.
flutter_native_splash:
  color: "#0F1923"
  android: true
  ios: true
  android_12:
    color: "#0F1923"
    icon_background_color: "#0F1923"
  fullscreen: false
