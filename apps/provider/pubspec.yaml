name: myshop_provider
description: MyShop Provider App — Drive or offer artisan services in Ghana
publish_to: 'none'
# Store-update marketing version. Legal-document consent versions remain
# independent. Release builds must override the local build-number floor through
# tool/build.sh after checking both private consoles.
version: 1.4.7+40

environment:
  sdk: ^3.6.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # Flutter's adaptive Cupertino widgets reference this icon font even when
  # most screens use Material components. Keep it packaged in release builds.
  cupertino_icons: ^1.0.9
  
  # Shared packages
  api_client:
    path: ../../packages/api_client
  shared_models:
    path: ../../packages/shared_models
  shared_ui:
    path: ../../packages/shared_ui
  shared_utils:
    path: ../../packages/shared_utils
  incoming_request_overlay:
    path: ../../packages/incoming_request_overlay
  
  # Navigation
  go_router: ^15.1.0
  
  # State management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0
  
  # Networking
  dio: ^5.7.0
  
  # Maps
  google_maps_flutter: ^2.10.0
  mapbox_maps_flutter: 2.20.1
  geolocator: ^13.0.0
  flutter_tts: ^4.2.0
  
  # Storage
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  
  # Media
  image_picker: ^1.1.0
  cached_network_image: ^3.4.0
  file_picker: ^8.1.0
  # Foreground ringtone for incoming job/ride requests. Pure-Dart, no
  # native plumbing. The asset path lives under
  # `assets/audio/incoming_request.mp3`; LocalNotificationService falls back
  # to haptic-only if decoding or audio-route setup fails at runtime.
  audioplayers: ^6.0.0
  
  # Communication
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  
  # Push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0
  
  # Realtime
  socket_io_client: ^3.0.0
  
  # UI
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  fl_chart: ^0.69.0

  # PDF / sharing — drives the earnings report export.
  pdf: ^3.11.0
  printing: ^5.13.0
  
  # Utilities
  equatable: ^2.0.7
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.0
  riverpod_lint: ^2.6.0
  mockito: ^5.4.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/i18n/
    - assets/audio/

  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway/Raleway-Variable.ttf

# ── Launcher Icons ──────────────────────────────────────────────────────────
# Source PNG must be 1024×1024 with a transparent background for production
# store submission. Drop the provider-flavored logo at
# assets/images/myshop_provider_logo.png and run:
#   cd apps/provider && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/myshop_provider_logo.png"
  remove_alpha_ios: true
  background_color_ios: "#0F1923"
  adaptive_icon_background: "#0F1923"
  adaptive_icon_foreground: "assets/images/myshop_provider_logo.png"
  min_sdk_android: 24

# ── Native Splash ──────────────────────────────────────────────────────────
# Native splash is the OS-drawn solid dark-navy frame that fills the gap
# between app launch and Flutter taking over. The animated in-app
# ProviderSplashScreen owns the brand identity — keeping native splash plain
# gives a seamless handoff: OS draws #0F1923, Flutter takes over on the same bg.
# Regenerate after editing:
#   cd apps/provider && dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0F1923"
  android: true
  ios: true
  android_12:
    color: "#0F1923"
    icon_background_color: "#0F1923"
  fullscreen: false
