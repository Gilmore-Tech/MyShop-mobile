name: myshop_mobile
repository: https://github.com/gilmore-technologies/myshop-mobile

packages:
  - apps/*
  - packages/*

command:
  bootstrap:
    usePubspecOverrides: true
    runPubGetInParallel: false

scripts:
  analyze:
    exec: dart analyze --fatal-infos
    description: Run static analysis
  
  format:
    exec: dart format --set-exit-if-changed .
    description: Check formatting
  
  test:
    # Multiple Flutter tools can race while validating a newly restored SDK
    # cache and briefly observe an empty engine revision. Run package suites
    # serially; each individual flutter test process still uses its own normal
    # test concurrency.
    run: melos exec --concurrency=1 --dir-exists=test -- "flutter test"
    description: Run tests in all packages
  
  build:client:android:
    exec: flutter build apk --release
    packageFilters:
      scope: myshop_client
  
  build:client:ios:
    exec: flutter build ios --release --no-codesign
    packageFilters:
      scope: myshop_client
  
  build:provider:android:
    exec: flutter build apk --release
    packageFilters:
      scope: myshop_provider
  
  build:provider:ios:
    exec: flutter build ios --release --no-codesign
    packageFilters:
      scope: myshop_provider
  
  clean:
    exec: flutter clean
    description: Clean all packages
