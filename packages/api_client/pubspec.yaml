name: api_client
description: MyShop API client — HTTP + WebSocket services
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  dio: ^5.7.0
  socket_io_client: ^3.0.0
  flutter_webrtc: ^1.5.2
  shared_models:
    path: ../shared_models
  flutter_secure_storage: ^9.2.0
  device_info_plus: ^11.5.0
  uuid: ^4.5.1
  clock: ^1.1.1
  # Used for `debugPrint` and `@visibleForTesting`. Declared explicitly
  # so this package's Flutter dependency is no longer implicit through
  # the consumer apps.
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  mocktail: ^1.0.0
  fake_async: ^1.3.0
