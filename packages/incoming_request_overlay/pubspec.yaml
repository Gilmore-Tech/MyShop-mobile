name: incoming_request_overlay
description: Native Android overlay for time-limited incoming provider offers.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.gilmoretech.incoming_request_overlay
        pluginClass: IncomingRequestOverlayPlugin
