name: Mobile CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  staging-promotion:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require staging as the source of main promotions
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$BASE_BRANCH" == "main" ]]; then
            if [[ "$HEAD_BRANCH" != "staging" || "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::Main accepts pull requests only from this repository's staging branch. Send feature, fix, and release changes through staging first."
              exit 1
            fi
          fi

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true
      
      - name: Install Melos
        run: dart pub global activate melos 2.9.0
      
      - name: Bootstrap
        run: melos bootstrap
      
      - name: Format check
        run: melos run format
      
      - name: Analyze
        run: melos run analyze
      
      - name: Test
        run: melos run test --no-select

      - name: Release contract tests
        run: |
          bash tool/test-release-version-contract.sh
          bash tool/test-release-source-contract.sh
          bash tool/test-release-artifact-contract.sh
          bash tool/test-release-workflow-contract.sh
          python3 tool/test-promotion-policy.py

  build-client-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Keep Gradle on the same supported runtime as Android releases.
      - name: Setup Java
        # actions/setup-java v4
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      
      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true
      
      - name: Install Melos
        run: dart pub global activate melos 2.9.0
      
      - name: Bootstrap
        run: melos bootstrap

      - name: Configure Android toolchain for CI
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          cp .github/gradle-ci.properties apps/client/android/gradle.properties
      
      - name: Build Client APK
        run: cd apps/client && flutter build apk --debug

  build-provider-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Keep Gradle on the same supported runtime as Android releases.
      - name: Setup Java
        # actions/setup-java v4
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      
      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true
      
      - name: Install Melos
        run: dart pub global activate melos 2.9.0
      
      - name: Bootstrap
        run: melos bootstrap

      - name: Configure Android toolchain for CI
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          cp .github/gradle-ci.properties apps/provider/android/gradle.properties
      
      - name: Build Provider APK
        run: cd apps/provider && flutter build apk --debug
