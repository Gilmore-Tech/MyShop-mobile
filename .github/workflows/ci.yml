name: Mobile CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true
      
      - name: Install Melos
        run: dart pub global activate melos 2.9.0
      
      - name: Bootstrap
        run: melos bootstrap
      
      - name: Format check
        run: melos run format
      
      - name: Analyze
        run: melos run analyze
      
      - name: Test
        run: melos run test --no-select

  build-client-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true
      
      - name: Install Melos
        run: dart pub global activate melos 2.9.0
      
      - name: Bootstrap
        run: melos bootstrap
      
      - name: Build Client APK
        run: cd apps/client && flutter build apk --debug

  build-provider-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true
      
      - name: Install Melos
        run: dart pub global activate melos 2.9.0
      
      - name: Bootstrap
        run: melos bootstrap
      
      - name: Build Provider APK
        run: cd apps/provider && flutter build apk --debug
