name: Mobile CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true
      
      - name: Install Melos
        run: dart pub global activate melos 2.9.0
      
      - name: Bootstrap
        run: melos bootstrap
      
      - name: Format check
        run: melos run format
      
      - name: Analyze
        run: melos run analyze
      
      - name: Test
        run: melos run test --no-select

      - name: Release contract tests
        run: |
          bash tool/test-release-version-contract.sh
          bash tool/test-release-source-contract.sh
          bash tool/test-release-artifact-contract.sh
          bash tool/test-release-workflow-contract.sh

  build-client-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true
      
      - name: Install Melos
        run: dart pub global activate melos 2.9.0
      
      - name: Bootstrap
        run: melos bootstrap

      - name: Configure Gradle for CI
        run: cp .github/gradle-ci.properties apps/client/android/gradle.properties
      
      - name: Build Client APK
        run: cd apps/client && flutter build apk --debug

  build-provider-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      # subosito/flutter-action v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true
      
      - name: Install Melos
        run: dart pub global activate melos 2.9.0
      
      - name: Bootstrap
        run: melos bootstrap

      - name: Configure Gradle for CI
        run: cp .github/gradle-ci.properties apps/provider/android/gradle.properties
      
      - name: Build Provider APK
        run: cd apps/provider && flutter build apk --debug
