# Non-secret Android configuration for GitHub-hosted debug builds.
# Release and local builds continue to generate their ignored per-app files.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
